<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>STO Barcode</title>
<meta name="theme-color" content="#0f5132">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="STO Scan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root { --pri:#0f5132; --pri2:#198754; --bg:#f2f4f3; --card:#fff; --tx:#1d2420; --mut:#6b746f; --err:#b42318; --warn:#9a6700; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; background:var(--bg); color:var(--tx); }
  header { background:var(--pri); color:#fff; padding:10px 14px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:5; gap:8px; }
  header b { font-size:17px; } header small { opacity:.85; }
  #btnInstall { background:#fff; color:var(--pri); padding:7px 10px; font-size:13px; border-radius:8px; }
  main { max-width:560px; margin:0 auto; padding:10px; }
  .card { background:var(--card); border-radius:12px; padding:12px; margin-bottom:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  label { font-size:12px; color:var(--mut); display:block; margin:8px 0 3px; font-weight:600; text-transform:uppercase; letter-spacing:.3px; }
  input, select { width:100%; font-size:16px; padding:10px; border:1px solid #cfd6d2; border-radius:8px; background:#fff; }
  input:focus, select:focus { outline:2px solid var(--pri2); border-color:transparent; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  button { font-size:16px; padding:12px; border:0; border-radius:10px; font-weight:700; cursor:pointer; }
  .b-pri { background:var(--pri2); color:#fff; } .b-sec { background:#e3e8e5; color:var(--tx); }
  button:disabled { opacity:.5; }
  #reader { width:100%; border-radius:10px; overflow:hidden; background:#000; position:relative; }
  #reader video.nat { width:100%; display:block; max-height:52vh; object-fit:cover; }
  #aim { position:absolute; left:8%; right:8%; top:22%; bottom:22%; border:3px solid rgba(255,255,255,.85); border-radius:12px;
         box-shadow:0 0 0 2000px rgba(0,0,0,.25); pointer-events:none; transition:border-color .1s; }
  #aim.hit { border-color:#3ddc5a; box-shadow:0 0 0 2000px rgba(61,220,90,.25); }
  #engine { position:absolute; right:8px; bottom:6px; font-size:11px; color:#fff; background:rgba(0,0,0,.45); padding:2px 6px; border-radius:6px; }
  .hint { font-size:13px; color:var(--mut); margin:6px 0 0; }
  #result { border:2px solid var(--pri2); }
  .kode { font-family:ui-monospace,Consolas,monospace; font-size:14px; background:#eef6f1; padding:3px 8px; border-radius:6px; display:inline-block; margin:0 4px 4px 0; }
  .kode.lb { background:#1f3a5f; color:#fff; }
  .nama { font-size:20px; font-weight:800; margin:4px 0 2px; }
  .badge { display:inline-block; font-size:12px; padding:2px 8px; border-radius:20px; background:#e3e8e5; }
  .alert { padding:8px 10px; border-radius:8px; font-size:14px; margin-top:8px; }
  .a-warn { background:#fff4d6; color:var(--warn); } .a-err { background:#fde8e6; color:var(--err); }
  #qty { font-size:28px; font-weight:800; text-align:center; padding:12px; }
  .list .it { display:flex; justify-content:space-between; gap:8px; border-bottom:1px solid #eef0ef; padding:8px 0; font-size:14px; }
  .list .it:last-child { border:0; } .list .q { font-weight:800; white-space:nowrap; }
  .list .x { background:none; color:var(--err); padding:4px 8px; font-size:13px; }
  #toast { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#1d2420; color:#fff; padding:12px 18px; border-radius:10px; font-size:15px; display:none; z-index:30; max-width:90%; text-align:center; }
  .chk { display:flex; align-items:center; gap:8px; font-size:14px; margin-top:10px; } .chk input { width:auto; }
  .hide { display:none !important; }
  .stat { font-size:13px; color:var(--mut); }
  .per { display:inline-block; background:#fff3; padding:1px 8px; border-radius:20px; font-size:12px; }
  /* Notifikasi SUDAH DISCAN (layar penuh) */
  #block { position:fixed; inset:0; background:rgba(180,35,24,.96); color:#fff; z-index:40; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; text-align:center; }
  #block h1 { font-size:30px; margin:8px 0; } #block .big { font-size:64px; }
  #block .det { font-size:16px; line-height:1.5; background:rgba(0,0,0,.2); padding:12px; border-radius:10px; margin:12px 0; max-width:420px; }
  #block button { background:#fff; color:var(--err); width:100%; max-width:320px; font-size:18px; }
  /* pilihan mode */
  .seg { display:flex; background:#e3e8e5; border-radius:10px; padding:3px; gap:3px; margin-bottom:8px; }
  .seg button { flex:1; background:transparent; color:var(--tx); padding:10px 6px; font-size:15px; border-radius:8px; }
  .seg button.on { background:#fff; color:var(--pri); box-shadow:0 1px 3px rgba(0,0,0,.15); }
  .seg button[data-m="harian"].on { color:#7a4b00; }
  .shiftbox { background:#fff4d6; color:#7a4b00; border-radius:8px; padding:8px 10px; font-size:14px; margin-bottom:4px; display:flex; justify-content:space-between; gap:8px; }
  body.harian header { background:#7a4b00; }
  body.harian #result { border-color:#c98a1a; }
  /* qty sebelumnya + keypad angka */
  .prevbox { background:#f3f6ff; border:1px solid #d5def5; border-radius:8px; padding:8px 10px; margin-top:8px; font-size:14px; }
  .prevbox b { font-size:18px; }
  #qty { caret-color:transparent; }
  #qty.fresh { color:#1f3a5f; background:#eef6f1; }
  .pad { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-top:8px; user-select:none; }
  .pad button { font-size:24px; padding:12px 0; background:#eef1ef; color:var(--tx); border-radius:10px; touch-action:manipulation; }
  .pad button:active { background:#cfd6d2; }
  .pad .fn { font-size:16px; background:#e3e8e5; }
  .pad .prev { font-size:15px; background:#dbe7fb; color:#1f3a5f; }
  .pad .z { grid-column:span 2; }
  #result.noreg #qtyLbl, #result.noreg #qty, #result.noreg #pad, #result.noreg #catLbl, #result.noreg #catatan, #result.noreg #rManualBox, #result.noreg #btnSimpan { display:none !important; }
  .newbox { background:#e8f5ec; border:1px solid #b9dfc6; color:#0f5132; }
  .sel { font-weight:800; } .sel.up { color:#0f7a0f; } .sel.dn { color:var(--err); }
</style>
</head>
<body>
<header>
  <div><b>STO Barcode</b> <small id="qstat" style="padding:1px 8px;border-radius:20px;background:#ffffff33">✅</small><br><small id="tgl">memuat…</small></div>
  <div style="text-align:right"><button id="btnInstall" class="hide">📲 Install</button><br><small id="ver"></small></div>
</header>
<main>
  <div id="verWarn" class="card hide" style="background:#fde8e6;color:#b42318;border:2px solid #b42318;font-size:14px"></div>
  <div class="card">
    <div class="seg" id="modeSeg"><button data-m="normal" class="on">📦 STO Normal</button><button data-m="harian">🕒 STO Harian</button></div>
    <div class="shiftbox hide" id="shiftBox"></div>
    <div class="row">
      <div><label>PIC</label><input id="pic" placeholder="Nama PIC" autocomplete="name"></div>
      <div><label>Lokasi / Area</label><select id="lokasi"><option value="">— pilih —</option></select></div>
    </div>
  </div>

  <div class="card">
    <div id="reader"></div>
    <div class="row" style="margin-top:8px">
      <button id="btnScan" class="b-pri">📷 Mulai Scan</button>
      <button id="btnFoto" class="b-sec">🖼️ Foto Barcode</button>
    </div>
    <input id="file" type="file" accept="image/*" capture="environment" class="hide">
    <label>atau ketik / scanner bluetooth</label>
    <div class="row">
      <input id="manual" placeholder="No label / kode lalu Enter" autocapitalize="characters" style="flex:3">
      <button id="btnCari" class="b-sec" style="flex:1">Cari</button>
    </div>
    <div class="chk" id="mode1Box"><input type="checkbox" id="mode1"><span>Mode cepat: Qty otomatis <b>1</b> & langsung simpan tiap scan</span></div>
    <p class="hint" id="camHint"></p>
    <div id="readerFile" class="hide"></div>
  </div>

  <div class="card hide" id="result">
    <div><span class="kode lb hide" id="rLabel"></span><span class="kode" id="rKode"></span><span class="badge hide" id="rSat"></span></div>
    <div class="nama" id="rNama"></div>
    <div id="rAlert"></div>
    <div id="rManualBox" class="hide">
      <label>Nama Item (manual, item belum ada di master)</label>
      <input id="namaManual" placeholder="Tulis nama barang">
    </div>
    <div id="rPrev" class="prevbox hide"></div>
    <label id="qtyLbl">Qty <span id="rSat2"></span></label>
    <input id="qty" inputmode="none" readonly placeholder="0" autocomplete="off">
    <div class="pad" id="pad">
      <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="del" class="fn">⌫</button>
      <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="C" class="fn">C</button>
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="," class="fn">,</button>
      <button data-k="0" class="z">0</button><button data-k="00">00</button><button data-k="prev" class="prev" id="kPrev">= Lalu</button>
    </div>
    <label id="catLbl">Catatan (opsional)</label>
    <input id="catatan" placeholder="mis. rusak, kemasan terbuka">
    <div class="row" style="margin-top:12px">
      <button id="btnBatal" class="b-sec">Batal</button>
      <button id="btnSimpan" class="b-pri" style="flex:2">💾 Simpan</button>
    </div>
  </div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b>Scan saya hari ini</b><span class="stat" id="cnt">0 data</span>
    </div>
    <div class="list" id="list"><p class="hint">Belum ada data.</p></div>
  </div>
</main>
<div id="toast"></div>
<div id="block" class="hide">
  <div class="big">⛔</div>
  <h1 id="blockTitle">SUDAH DISCAN</h1>
  <div id="blockTxt" style="font-size:18px;font-weight:700"></div>
  <div class="det" id="blockDet"></div>
  <p style="opacity:.9" id="blockNote">Data tidak disimpan supaya tidak dobel.</p>
  <button id="blockOk">OK, lanjut scan</button>
  <p style="opacity:.8;font-size:13px">menutup otomatis dalam 3 detik</p>
</div>

<script>
const $ = id => document.getElementById(id);
const S = { items: {}, labels: {}, scanned: {}, periode: '', blokir: true, cur: null, scanner: null, scanning: false, busy: false, lastCode: '', lastTime: 0 };
const store = {
  get: k => { try { return localStorage.getItem('stob_' + k) || ''; } catch (e) { return ''; } },
  set: (k, v) => { try { localStorage.setItem('stob_' + k, v); } catch (e) {} }
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = k => String(k || '').trim().toUpperCase();

/* antrian simpan (tersimpan di HP sampai terkirim) */
const Q = (() => { try { return JSON.parse(store.get('queue') || '[]'); } catch (e) { return []; } })();
const REJ = [];                 // ditolak server (dobel / error) - tampil merah di daftar
let SENDING = false, RETRY = 0, OFFLINE = false;

/* mode STO: 'normal' (per periode) | 'harian' (per shift) */
let MODE = (() => { try { return localStorage.getItem('stob_mode') || 'normal'; } catch (e) { return 'normal'; } })();
const SHIFT_JAM = { 1: '07:00–15:00', 2: '15:00–23:00', 3: '23:00–07:00' };
/** Shift sekarang (jam WIB): S1 07–15, S2 15–23, S3 23–07 (dini hari = S3 tanggal kemarin) */
function shiftNow(d) {
  d = d || new Date();
  const part = (dt) => { const o = {}; new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Jakarta', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', hourCycle: 'h23' })
    .formatToParts(dt).forEach(x => o[x.type] = x.value); return o; };
  const p = part(d), h = Number(p.hour);
  let tg = p.year + '-' + p.month + '-' + p.day, n;
  if (h >= 7 && h < 15) n = 1; else if (h >= 15 && h < 23) n = 2;
  else { n = 3; if (h < 7) { const q = part(new Date(d.getTime() - 864e5)); tg = q.year + '-' + q.month + '-' + q.day; } }
  return { n: n, tgl: tg, key: tg + ' S' + n, jam: SHIFT_JAM[n] };
}
const hkey = info => norm(info.scan || info.kode);          // STO Harian: kode yang discan apa adanya
const fmtQty = v => v === '' || v == null ? '' : String(v).replace('.', ',');

/* ===== KONFIGURASI VERSI GITHUB =====
 * Isi 2 nilai ini bila file ini di-host di GitHub Pages (supaya kamera bisa dibuka).
 * Nilainya ada di Spreadsheet: menu STO Barcode > Info link HP (GitHub).
 * Bila dibuka dari link Apps Script (/exec), biarkan kosong.
 */
const API_URL = 'https://script.google.com/macros/s/AKfycbzCuOh0oIGFaIsyJQ-tvARYe360TFd_CgPOB6iOoopM3pxRQ8vi9yJ1AbnHbQ4MOxuOeA/exec';
const API_KEY = 'c6cbd0f1b77144cc';

const CLIENT_VERSION = '1.6.1';
const MIN_SERVER = '1.6.1';               // versi Apps Script minimal yang dibutuhkan aplikasi ini
const IN_GAS = typeof google !== 'undefined' && google.script && google.script.run;
const API_NAME = { getInit: 'init', resolveCode: 'resolve', resolveHarian: 'rharian', saveScan: 'save', saveBatch: 'batch', getRecent: 'recent', deleteScan: 'del' };
function run(fn, ...a) {
  if (IN_GAS) return new Promise((ok, no) => google.script.run.withSuccessHandler(ok).withFailureHandler(e => no(e))[fn](...a));
  return apiCall(fn, a);
}
async function apiCall(fn, a) {
  const url = API_URL || store.get('api_url'), key = API_KEY || store.get('api_key');
  if (!url) throw new Error('API_URL belum diisi di file index.html');
  const body = { api: API_NAME[fn], key: key };
  if (fn === 'resolveCode' || fn === 'resolveHarian') body.kode = a[0];
  if (fn === 'saveScan') body.data = a[0];
  if (fn === 'saveBatch') body.list = a[0];
  if (fn === 'getRecent') body.pic = a[0];
  if (fn === 'deleteScan') { body.rid = a[0]; body.pic = a[1]; }
  let r;
  try {
    r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  } catch (e) { throw new Error('Tidak bisa menghubungi server (cek internet / akses deployment = Siapa saja)'); }
  let j;
  try { j = await r.json(); } catch (e) { throw new Error('Jawaban server tidak valid. Pastikan deployment akses = Siapa saja & API_URL berakhiran /exec'); }
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
(function () {   // alternatif: buka ?api=URL_EXEC&key=API_KEY sekali, nilainya tersimpan di HP
  try {
    const q = new URLSearchParams(location.search);
    if (q.get('api')) { store.set('api_url', q.get('api')); store.set('api_key', q.get('key') || ''); history.replaceState(null, '', location.pathname); }
  } catch (e) {}
})();

function toast(msg, ms) {
  const t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', ms || 2200);
}
/* Bunyi "TUT" kencang seperti scanner gudang. Browser HP mengunci suara sampai layar disentuh,
   jadi audio dibuka pada sentuhan pertama (mis. tombol Mulai Scan). */
function audioCtx() {
  if (!beep.ctx) { try { beep.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (beep.ctx.state === 'suspended') { try { beep.ctx.resume(); } catch (e) {} }
  return beep.ctx;
}
['touchstart', 'pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, function unlock() {
  const c = audioCtx(); if (!c) return;
  const b = c.createBuffer(1, 1, 22050), src = c.createBufferSource(); src.buffer = b; src.connect(c.destination); src.start(0);
}, { passive: true }));
function tone(c, freq, t0, dur, vol) {
  const o = c.createOscillator(), g = c.createGain(), comp = c.createDynamicsCompressor();
  o.type = 'square'; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.005);
  g.gain.setValueAtTime(vol, t0 + dur - 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(comp); comp.connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
function beep(ok) {
  try {
    const c = audioCtx();
    if (c) {
      const t = c.currentTime + 0.01;
      if (ok) tone(c, 2700, t, 0.16, 1.0);                                   // TUT! (sukses)
      else { tone(c, 420, t, 0.22, 1.0); tone(c, 330, t + 0.28, 0.32, 1.0); } // TUT-TUUT (gagal / ditolak)
    }
  } catch (e) {}
  try { navigator.vibrate && navigator.vibrate(ok ? 120 : [250, 100, 250, 100, 250]); } catch (e) {}
}

/* ---------- INIT (pakai data tersimpan di HP dulu supaya instan, lalu perbarui dari server) ---------- */
function applyInit(d) {
  S.today = d.today;
  $('ver').textContent = 'v' + CLIENT_VERSION;
  S.hlast = {}; (d.hlast || []).forEach(x => S.hlast[norm(x[0])] = { qty: x[1], sh: x[2], pic: x[3], time: x[4], lokasi: x[5], kode: x[6] || '', label: x[7] || '', nama: x[8] || '', satuan: x[9] || '' });
  Q.forEach(x => { if (x.mode === 'harian') (x.hkeys || [x.hkey]).forEach(k => { if (k) S.hlast[k] = { qty: x.qty, sh: x.shift, pic: x.pic, time: x.time, lokasi: x.lokasi, kode: x.kodeItem || '', nama: x.nama, satuan: x.satuan }; }); });
  S.periode = d.periode; S.blokir = d.blokir !== false;
  S.items = {}; d.items.forEach(x => S.items[norm(x[0])] = x);
  S.labels = {}; (d.labels || []).forEach(x => S.labels[norm(x[0])] = x);
  try { const ex = JSON.parse(store.get('extra') || '{"i":{},"l":{}}');
    Object.keys(ex.i).forEach(k => { if (!S.items[k]) S.items[k] = ex.i[k]; });
    Object.keys(ex.l).forEach(k => { if (!S.labels[k]) S.labels[k] = ex.l[k]; }); } catch (e) {}
  S.scanned = {}; (d.scanned || []).forEach(x => S.scanned[norm(x)] = true);
  Q.forEach(x => { if (x.label && x.mode !== 'harian') S.scanned[norm(x.label)] = true; });   // yang masih antre tetap dianggap sudah discan
  const sel = $('lokasi'), cur = sel.value || store.get('lokasi');
  sel.innerHTML = '<option value="">— pilih —</option>';
  d.lokasi.forEach(l => { const o = document.createElement('option'); o.value = o.textContent = l; sel.appendChild(o); });
  if (cur) sel.value = cur;
  S.initInfo = (d.masterCount || d.items.length).toLocaleString('id-ID') + ' item master · ' + (d.labels || []).length + ' label · ' + (d.scanned || []).length + ' label sudah discan periode ini.';
  // Peringatan bila Apps Script (server) belum diperbarui ke versi yang sama dengan aplikasi ini
  const vnum = v => String(v || '0').split('.').map(Number).reduce((a, x) => a * 1000 + (x || 0), 0);
  if (vnum(d.version) < vnum(MIN_SERVER)) {
    $('verWarn').innerHTML = '⚠️ Server Apps Script masih <b>v' + esc(d.version) + '</b>, aplikasi ini butuh minimal <b>v' + MIN_SERVER + '</b>. ' +
      'Ganti Kode.gs, jalankan setup, lalu Terapkan → Kelola deployment → Versi baru. Mode STO Harian tidak akan berfungsi sebelum server diperbarui.';
    $('verWarn').classList.remove('hide');
  } else $('verWarn').classList.add('hide');
  renderHeader();
}
function renderHeader() {
  const sf = shiftNow();
  if (MODE === 'harian') {
    $('tgl').innerHTML = '<span class="per">🕒 Shift ' + sf.n + ' · ' + sf.jam + '</span> · ' + esc(sf.tgl);
    const done = Object.values(S.hlast || {}).filter(x => x.sh === sf.key).length;
    $('shiftBox').innerHTML = '<span><b>STO Harian · Shift ' + sf.n + '</b> (' + sf.jam + ')<br>Per Kode Barcode · 1x per shift</span><span style="text-align:right"><b>' + done + '</b><br>sudah discan</span>';
    $('camHint').textContent = 'Qty shift/hari sebelumnya muncul otomatis, tinggal ubah bila berbeda.';
  } else {
    $('tgl').innerHTML = esc(S.today || '') + ' · <span class="per">Periode ' + esc(S.periode || '') + '</span>';
    $('camHint').textContent = S.initInfo || '';
  }
}
function setMode(m) {
  MODE = m; try { localStorage.setItem('stob_mode', m); } catch (e) {}
  document.body.classList.toggle('harian', m === 'harian');
  [...$('modeSeg').children].forEach(b => b.classList.toggle('on', b.dataset.m === m));
  $('shiftBox').classList.toggle('hide', m !== 'harian');
  $('mode1Box').classList.toggle('hide', m === 'harian');

/* ---------- SCANNER KAMERA ---------- */
const F = Html5QrcodeSupportedFormats;
const scanCfg = { formatsToSupport: [F.QR_CODE, F.CODE_128, F.EAN_13],
  verbose: false, experimentalFeatures: { useBarCodeDetectorIfSupported: true } };

/* ---- Pembaca barcode BAWAAN HP (Chrome Android: BarcodeDetector) — paling cepat ---- */
async function startNative() {
  if (!('BarcodeDetector' in window)) return false;
  let fm = [];
  try { fm = await BarcodeDetector.getSupportedFormats(); } catch (e) { return false; }
  const want = ['qr_code', 'code_128', 'code_39', 'ean_13', 'ean_8', 'upc_a'].filter(f => fm.includes(f));
  if (!want.includes('qr_code') || !want.includes('code_128')) return false;
  const det = new BarcodeDetector({ formats: want });
  const stream = await navigator.mediaDevices.getUserMedia({ audio: false,
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } } });
  const track = stream.getVideoTracks()[0];
  try { await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}   // fokus otomatis terus-menerus
  const box = $('reader');
  box.innerHTML = '<video class="nat" playsinline muted autoplay></video><div id="aim"></div><div id="engine">⚡ pembaca HP</div>';
  const video = box.querySelector('video');
  video.srcObject = stream; await video.play();
  S.native = { stream: stream, det: det, video: video, busy: false, on: true };
  const tick = async () => {
    const n = S.native; if (!n || !n.on) return;
    if (!n.busy && video.readyState >= 2 && !S.hold && !S.cur) {
      n.busy = true;
      try {
        const codes = await det.detect(video);
        if (codes.length) { flashAim(); onDecoded(codes[0].rawValue); }
      } catch (e) {}
      n.busy = false;
    }
    n.timer = setTimeout(tick, 40);                                  // ±25 kali per detik
  };
  tick();
  return true;
}
function flashAim() { const a = $('aim'); if (!a) return; a.classList.add('hit'); clearTimeout(flashAim.t); flashAim.t = setTimeout(() => a.classList.remove('hit'), 350); }
function stopNative() {
  const n = S.native; if (!n) return;
  n.on = false; clearTimeout(n.timer);
  try { n.stream.getTracks().forEach(t => t.stop()); } catch (e) {}
  S.native = null; $('reader').innerHTML = '';
}

async function startScan() {
  if (needSetup()) return;
  try {
    if (await startNative()) { S.scanning = true; $('btnScan').textContent = '⏹ Stop Scan'; return; }
    // cadangan: library html5-qrcode (HP tanpa pembaca bawaan / iPhone)
    if (!S.scanner) S.scanner = new Html5Qrcode('reader', scanCfg);
    await S.scanner.start({ facingMode: 'environment' },
      { fps: 25, qrbox: (w, h) => ({ width: Math.floor(w * .85), height: Math.floor(Math.min(h, w) * .55) }), aspectRatio: 1.333,
        videoConstraints: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 }, advanced: [{ focusMode: 'continuous' }] } },
      onDecoded, () => {});
    S.scanning = true; $('btnScan').textContent = '⏹ Stop Scan';
  } catch (e) {
    S.scanning = false;
    const blocked = /NotAllowed|Permission/i.test(String(e && (e.name || e.message) || e));
    $('camHint').innerHTML = '<span style="color:#b42318">Kamera tidak bisa dibuka (' + esc(e.message || e) + ').</span><br>' +
      (blocked && IN_GAS ? 'Halaman Google memblokir kamera: pakai aplikasi versi GitHub, atau tombol <b>Foto Barcode</b>.'
        : blocked ? 'Izinkan kamera: ketuk ikon 🔒 di sebelah alamat → Izin → Kamera → Izinkan, lalu muat ulang.'
          : 'Pakai tombol <b>Foto Barcode</b> atau ketik kode.');
  }
}
async function stopScan() {
  stopNative();
  if (S.scanner && S.scanning) { try { await S.scanner.stop(); } catch (e) {} }
  S.scanning = false; $('btnScan').textContent = '📷 Mulai Scan';
}
/* Kamera TIDAK dibekukan: selama form/notifikasi terbuka hasil baca diabaikan saja,
   jadi setelah Simpan kamera langsung siap (tanpa "Scanner paused"). */
function pauseScan() { S.hold = true; }
function resumeScan() { S.hold = false; S.readyAt = Date.now() + 250; }
$('btnScan').onclick = () => S.scanning ? stopScan() : startScan();
document.addEventListener('visibilitychange', () => { if (document.hidden) stopScan(); });

function onDecoded(text) {
  const now = Date.now(), code = norm(text);
  if (S.hold || S.busy || S.cur || now < (S.readyAt || 0) || !$('block').classList.contains('hide')) return;
  if (code === S.lastCode && now - S.lastTime < 3000) return;               // bacaan ganda dari frame kamera
  if (code === S.lastSaved && now - S.lastSavedAt < 15000) return;          // label yang baru disimpan masih di depan kamera
  S.lastCode = code; S.lastTime = now;
  handleCode(text);
}

    const text = await r.scanFile(f, false);

    handleCode(text);

/* ---------- PROSES KODE ---------- */
async function handleCode(raw) {
  const code = norm(raw);
  if (!code) return;
  pauseScan();
  if (MODE === 'harian') return handleHarian(code);

  // STO Normal (logika awal): kode yang discan -> Master_Item kolom A. Tidak memakai Label_Log.
  if (S.items[code]) {                                             // pernah dicari -> tampil instan
    const it = S.items[code], info = { type: 'item', kode: it[0], nama: it[1], satuan: it[2] };
    beep(true);
    if ($('mode1').checked) { S.cur = info; return save('1', ''); }
    showResult(info);
    run('resolveCode', code).then(r => applyResolve(r, code)).catch(() => {});
    return;
  }
  toast('Mencari ' + code + '…', 1500);
  try {
    const r = await run('resolveCode', code);
    rememberCode(r);
    beep(r.type !== 'unknown');
    if (r.type !== 'unknown' && $('mode1').checked) { S.cur = r; return save('1', ''); }
    showResult(r); applyResolve(r, code);
  } catch (e) { beep(false); toast('Gagal cek kode: ' + e.message, 4000); resumeScan(); }
}

/* ---------- STO HARIAN: 1x per shift, qty sebelumnya langsung muncul ---------- */
function blockShift(info, last) {
  S.cur = { blocked: true }; $('result').classList.add('hide');
  showBlock((info.scan || info.kode) + (info.kode && norm(info.kode) !== norm(info.scan || info.kode) ? ' (kode ' + info.kode + ')' : ''), info.nama, null,
    'Sudah discan shift ini (' + last.sh + ') jam ' + (last.time || '-') + ' oleh ' + (last.pic || '-') + (last.lokasi ? ' di ' + last.lokasi : '') + ' · qty ' + fmtQty(last.qty),
    'SUDAH DISCAN SHIFT INI');
}
async function handleHarian(code) {
  // 1) cek STO_Harian (salinan di HP: Harian_Terakhir) -> 2) cek Master_Item kolom A -> 3) tidak terdaftar
  let last = S.hlast[code], info = null, fromServer = false;
  if (last) info = { scan: code, kode: last.kode || code, label: last.label || '', nama: last.nama || ((S.items[norm(last.kode || code)] || [])[1]) || code, satuan: last.satuan || '', status: 'ADA' };
  else if (S.items[code]) { const it = S.items[code]; info = { scan: code, kode: it[0], label: '', nama: it[1], satuan: it[2], status: 'PRODUKSI BARU' }; }
  if (!info) {
    toast('Mencari ' + code + '…', 1200);
    try {
      const r = await run('resolveHarian', code);
      info = { scan: code, kode: r.kode, label: r.label || '', nama: r.nama, satuan: r.satuan, status: r.status }; fromServer = true;
      if (r.hlast) { last = Object.assign({}, r.hlast, { kode: r.kode, label: r.label, nama: r.nama, satuan: r.satuan }); S.hlast[code] = last; }
      if (r.status === 'PRODUKSI BARU') rememberCode({ type: 'item', kode: code, nama: r.nama, satuan: r.satuan });
    } catch (e) { beep(false); toast('Gagal cek kode: ' + e.message, 4000); return resumeScan(); }
  }
  if (info.status === 'TIDAK TERDAFTAR') { beep(false); return showNotRegistered(info); }
  if (last && last.sh === shiftNow().key) return blockShift(info, last);
  beep(true);
  showResult(info);
  $('rKode').textContent = code;
  $('rLabel').textContent = info.kode && norm(info.kode) !== code ? 'kode ' + info.kode : '';
  $('rLabel').classList.toggle('hide', !(info.kode && norm(info.kode) !== code));
  if (last) showPrev(last); else showNew(false);
  if (fromServer) return;
  run('resolveHarian', code).then(r => {                          // pastikan ke server (HP lain / data tempelan di STO_Harian)
    if (!S.cur || S.cur.blocked || hkey(S.cur) !== code) return;
    if (r.hlast) {
      const h = Object.assign({}, r.hlast, { kode: r.kode, label: r.label, nama: r.nama, satuan: r.satuan });
      S.hlast[code] = h;
      if (h.sh === shiftNow().key) return blockShift(info, h);
      if (!last || last.sh !== h.sh || last.qty !== h.qty) { S.cur.status = 'ADA'; showPrev(h, true); }
    } else if (r.status === 'TIDAK TERDAFTAR') { $('result').classList.add('hide'); S.cur = null; beep(false); showNotRegistered(Object.assign(info, { status: r.status })); }
  }).catch(() => {});
}
function applyHarianStatus(r, key) {
  if (r.hlast) { if (r.hlast.sh === shiftNow().key) return blockShift(r, r.hlast); showPrev(r.hlast); }
  else showNew(false);
}

function applyResolve(r, code) {
  if (!S.cur || (S.cur.label || S.cur.kode) !== (r.label || r.kode)) return;

/* ---------- KEYPAD ANGKA DI LAYAR (tanpa keyboard HP) ---------- */
function setQty(v, fresh) { $('qty').value = v; S.fresh = !!fresh; $('qty').classList.toggle('fresh', !!fresh); }
function padKey(k) {
  let v = $('qty').value;
  if (k === 'C') v = '';
  else if (k === 'del') v = S.fresh ? '' : v.slice(0, -1);
  else if (k === 'prev') { if (S.prevQty != null) return setQty(fmtQty(S.prevQty), true); }
  else if (k === ',') { if (S.fresh) v = ''; if (!v.includes(',')) v = (v || '0') + ','; }
  else { if (S.fresh || v === '0') v = ''; if (v.replace(',', '').length < 10) v += k; }
  setQty(v, false);
}
$('pad').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { padKey(b.dataset.k); try { navigator.vibrate && navigator.vibrate(15); } catch (x) {} } });
$('qty').addEventListener('click', () => { if (S.fresh) setQty($('qty').value, false); });
document.addEventListener('keydown', e => {                 // keyboard PC / scanner bluetooth
  if ($('result').classList.contains('hide')) return;
  const a = document.activeElement && document.activeElement.id;
  if (a === 'catatan' || a === 'namaManual' || a === 'manual' || a === 'pic') { if (e.key === 'Enter' && a !== 'manual' && a !== 'pic') { e.preventDefault(); $('btnSimpan').click(); } return; }
  if (/^[0-9]$/.test(e.key)) { e.preventDefault(); padKey(e.key); }
  else if (e.key === 'Backspace') { e.preventDefault(); padKey('del'); }
  else if (e.key === ',' || e.key === '.') { e.preventDefault(); padKey(','); }
  else if (e.key === 'Enter') { e.preventDefault(); $('btnSimpan').click(); }
  else if (e.key === 'Escape') { e.preventDefault(); hideResult(); }
});

$('btnSimpan').onclick = () => {

  if (MODE === 'harian' && S.checking) { toast('Tunggu, sedang cek qty sebelumnya…'); return; }
  if (MODE === 'harian' && S.isNew && !(Number(q.replace(/\./g, '').replace(',', '.')) > 0)) { toast('Item produksi baru: isi qty lebih dari 0'); return; }

const saveQ = () => store.set('queue', JSON.stringify(Q));
const cidNew = () => Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 8).toUpperCase();

function save(qty, note) {
  if (!S.cur) return;
  const cur = S.cur;
  const e = {
    cid: cidNew(), pic: $('pic').value.trim(), lokasi: $('lokasi').value, kode: cur.kode, label: '',
    qty: qty, catatan: note, namaManual: $('namaManual').value.trim(),

    time: new Date().toTimeString().slice(0, 5), mode: MODE
  };
  if (MODE === 'harian') {
    const sf = shiftNow();
    e.kode = cur.scan; e.label = ''; e.kodeItem = cur.kode; e.shift = sf.key; e.hkey = hkey(cur); e.prev = S.prevQty;
    e.hkeys = [e.hkey, norm(cur.kode), norm(cur.label)].filter((k, i, a) => k && a.indexOf(k) === i);
    e.prevLasts = {}; e.hkeys.forEach(k => { e.prevLasts[k] = S.hlast[k] || null; });
    e.prevLast = S.hlast[e.hkey] || null;
    e.hkeys.forEach(k => { S.hlast[k] = { qty: qty, sh: sf.key, pic: e.pic, time: e.time, lokasi: e.lokasi, kode: cur.kode, label: cur.label, nama: cur.nama, satuan: cur.satuan }; });
  } else if (e.label) S.scanned[norm(e.label)] = true;          // scan berikutnya label ini langsung ditolak di HP
  Q.push(e); saveQ();
  S.lastSaved = norm(e.label || e.kode); S.lastSavedAt = Date.now();
  beep(true);
  const pq = e.prev != null && e.prev !== '' ? Number(String(e.prev).replace(',', '.')) : null, nq = Number(String(qty).replace(',', '.'));
  toast('✅ ' + (e.label ? e.label + ' · ' : '') + (e.nama || e.kode) + ' = ' + qty + (e.satuan ? ' ' + e.satuan : '') +
    (MODE === 'harian' && pq != null ? ' (lalu ' + fmtQty(pq) + (nq - pq ? ', ' + (nq > pq ? '+' : '') + fmtQty(Math.round((nq - pq) * 1000) / 1000) : ', sama') + ')' : ''), 1800);
  renderHeader();
  hideResult();
  renderList(); flush();
}

async function flush() {
  if (SENDING || !Q.length) { status(); return; }
  SENDING = true; status();
  const batch = Q.slice(0, 20);
  try {
    const res = await run('saveBatch', batch.map(x => ({ cid: x.cid, pic: x.pic, lokasi: x.lokasi, kode: x.kode, label: x.label,
      qty: x.qty, catatan: x.catatan, namaManual: x.namaManual, mode: x.mode || 'normal' })));
    OFFLINE = false; RETRY = 0;
    let firstDup = null;
    res.forEach(r => {
      const i = Q.findIndex(x => x.cid === r.cid);
      const e = i > -1 ? Q.splice(i, 1)[0] : null;
      if (!e) return;
      if (r.ok) { S.recent.unshift(Object.assign({}, e, { rid: r.rid, status: 'OK', nama: r.nama || e.nama, satuan: r.satuan || e.satuan,
        prev: r.qtyPrev !== undefined ? r.qtyPrev : e.prev, selisih: r.selisih, shift: r.shift || e.shift })); S.count++; }
      else if (r.dup && e.mode === 'harian') {
        REJ.unshift(Object.assign({}, e, { why: 'DOBEL SHIFT: sudah discan ' + r.dup.sh + ' jam ' + r.dup.time + ' oleh ' + r.dup.pic + ' (qty ' + fmtQty(r.dup.qty) + ')' }));
        S.hlast[e.hkey] = { qty: r.dup.qty, sh: r.dup.sh, pic: r.dup.pic, time: r.dup.time, lokasi: r.dup.lokasi };
        if (!firstDup) firstDup = { e: e, r: r };
      }
      else if (r.dup) { REJ.unshift(Object.assign({}, e, { why: 'DOBEL: sudah discan ' + r.dup.tgl + ' ' + r.dup.time + ' oleh ' + r.dup.pic + ' di ' + r.dup.lokasi })); if (!firstDup) firstDup = { e: e, r: r }; }
      else {
        REJ.unshift(Object.assign({}, e, { why: r.error || 'gagal' }));
        if (e.mode === 'harian') (e.hkeys || [e.hkey]).forEach(k => { const v = (e.prevLasts || {})[k]; if (v) S.hlast[k] = v; else delete S.hlast[k]; });
        else if (e.label) delete S.scanned[norm(e.label)];
        toast('⚠️ ' + (e.label || e.kode) + ': ' + r.error, 5000);
      }
    });
    saveQ();
    if (firstDup && firstDup.e.mode === 'harian') { const d = firstDup.r.dup; S.cur = { blocked: true };
      showBlock(firstDup.e.label || firstDup.e.kode, firstDup.e.nama, null, 'Sudah discan ' + d.sh + ' jam ' + d.time + ' oleh ' + d.pic + ' · qty ' + fmtQty(d.qty), 'SUDAH DISCAN SHIFT INI'); }
    else if (firstDup) showBlock(firstDup.e.label, firstDup.e.nama, [firstDup.r.dup]);
    renderHeader();
  } catch (err) {
    const m = String(err.message || err);
    if (/API key|tidak dikenal|API_URL/i.test(m)) toast('Gagal kirim: ' + m, 6000);
    OFFLINE = true; RETRY = Math.min(RETRY + 1, 6);
    setTimeout(flush, RETRY * 5000);                       // coba lagi: 5, 10, ... 30 detik
  } finally {
    SENDING = false; renderList(); status();
    if (Q.length && !OFFLINE) setTimeout(flush, 50);
  }
}
window.addEventListener('online', () => { RETRY = 0; flush(); });
setInterval(flush, 15000);

function status() {
  const el = $('qstat');
  if (!Q.length) { el.textContent = OFFLINE ? '📶 offline' : '✅ semua tersimpan'; el.style.background = OFFLINE ? '#9a6700' : '#ffffff33'; return; }
  el.textContent = (OFFLINE ? '📶 offline · ' : SENDING ? '⏫ mengirim · ' : '⏳ ') + Q.length + ' antre';
  el.style.background = OFFLINE ? '#9a6700' : '#ffffff33';
}

/* ---------- RIWAYAT (antre + ditolak + tersimpan) ---------- */
S.recent = []; S.count = 0;
function loadRecent() {
  const pic = $('pic').value.trim();
  if (!pic) return;
  run('getRecent', pic).then(d => {
    const sent = {}; Q.forEach(x => sent[x.cid] = true);
    S.recent = d.rows.filter(r => !sent[r.rid]); S.count = d.count;
    renderList();
  }).catch(() => {});
}
function selTxt(r) {
  if (r.mode !== 'harian' || r.selisih === '' || r.selisih == null) return '';
  const v = Number(r.selisih);
  return ' <span class="sel ' + (v > 0 ? 'up' : v < 0 ? 'dn' : '') + '">' + (v > 0 ? '+' : '') + esc(fmtQty(v)) + '</span>';
}
function renderList() {
  const me = norm($('pic').value);
  const pend = Q.filter(x => norm(x.pic) === me).slice().reverse();
  const item = (r, kind) => '<div class="it"' + (kind === 'rej' ? ' style="background:#fde8e6;border-radius:8px;padding:8px"' : '') + '><div><b>' +
    esc(r.nama || '(tanpa nama)') + '</b>' +
    (r.mode === 'harian' ? ' <span class="badge" style="background:#fff4d6;color:#7a4b00">🕒 ' + esc(String(r.shift || '').slice(-2) || 'Harian') + '</span>' : '') +
    (r.mode === 'harian' && (r.status === 'PRODUKSI BARU' || ((r.prev === '' || r.prev == null) && kind !== 'rej')) ? ' <span class="badge" style="background:#e8f5ec;color:#0f5132">🆕 baru</span>' : '') +
    (kind === 'pend' ? ' <span class="badge">⏳ antre</span>' : '') +
    (kind === 'rej' ? ' <span class="badge" style="background:#b42318;color:#fff">DITOLAK</span>' : '') +
    (kind === 'ok' && r.status !== 'OK' && r.status !== 'PRODUKSI BARU' ? ' <span class="badge" style="background:#fde8e6;color:#b42318">' + esc(r.status) + '</span>' : '') +
    '<br><span class="stat">' + esc(r.time + ' · ' + (r.label ? r.label + ' · ' : '') + r.kode + ' · ' + r.lokasi) + (r.catatan || r.note ? ' · ' + esc(r.catatan || r.note) : '') + '</span>' +
    (kind === 'rej' ? '<br><span class="stat" style="color:#b42318">' + esc(r.why) + '</span>' : '') + '</div>' +
    '<div style="text-align:right"><span class="q">' + (r.mode === 'harian' && r.prev !== '' && r.prev != null ? '<span class="stat">' + esc(fmtQty(r.prev)) + ' → </span>' : '') +
      esc(fmtQty(r.qty)) + ' ' + esc(r.satuan) + '</span>' + selTxt(r) + '<br>' +
    (kind === 'ok' ? '<button class="x" data-rid="' + esc(r.rid) + '" data-label="' + esc(r.label) + '">Hapus</button>'
      : kind === 'pend' ? '<button class="x" data-cid="' + esc(r.cid) + '">Batal</button>'
        : '<button class="x" data-rej="' + esc(r.cid) + '">Tutup</button>') + '</div></div>';
  const html = REJ.map(r => item(r, 'rej')).join('') + pend.map(r => item(r, 'pend')).join('') + S.recent.slice(0, 50).map(r => item(r, 'ok')).join('');
  $('cnt').textContent = (S.count + pend.length) + ' data' + (pend.length ? ' (' + pend.length + ' antre)' : '');
  $('list').innerHTML = html || '<p class="hint">Belum ada data.</p>';
}
$('list').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.rej) { const i = REJ.findIndex(x => x.cid === b.dataset.rej); if (i > -1) REJ.splice(i, 1); return renderList(); }
  if (b.dataset.cid) {                                      // batalkan yang masih antre (belum terkirim)
    if (SENDING) { toast('Sedang mengirim, coba lagi sebentar'); return; }
    const i = Q.findIndex(x => x.cid === b.dataset.cid);
    if (i > -1) { const x = Q.splice(i, 1)[0];
      if (x.mode === 'harian') (x.hkeys || [x.hkey]).forEach(k => { const v = (x.prevLasts || {})[k]; if (v) S.hlast[k] = v; else delete S.hlast[k]; });
      else if (x.label) delete S.scanned[norm(x.label)];
      saveQ(); renderHeader(); }
    toast('Dibatalkan'); renderList(); status(); return;
  }
  if (!b.dataset.rid) return;
  if (b.dataset.sure !== '1') { b.dataset.sure = '1'; b.textContent = 'Yakin hapus?'; setTimeout(() => { b.dataset.sure = ''; b.textContent = 'Hapus'; }, 3000); return; }
  b.disabled = true;
  run('deleteScan', b.dataset.rid, $('pic').value.trim())
    .then(res => {
      if (res && res.key) { (res.keys || [res.key]).forEach(k => delete S.hlast[k]); loadInit(); renderHeader(); }
      else if (b.dataset.label) delete S.scanned[norm(b.dataset.label)];
      toast('Data dihapus (bisa discan lagi)'); loadRecent(); })
    .catch(err => { toast('Gagal hapus: ' + err.message, 4000); b.disabled = false; });
});
renderList(); status(); flush();

/* ---------- APLIKASI TERINSTAL (khusus versi GitHub) ---------- */
if (!IN_GAS && 'serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  let deferred = null;
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; $('btnInstall').classList.remove('hide'); });
  window.addEventListener('appinstalled', () => { $('btnInstall').classList.add('hide'); toast('Aplikasi terpasang di layar utama ✅', 3000); });
  $('btnInstall').onclick = async () => {
    if (deferred) { deferred.prompt(); await deferred.userChoice; deferred = null; $('btnInstall').classList.add('hide'); }
    else toast('iPhone: tombol Bagikan → Tambah ke Layar Utama', 4000);
  };
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (!standalone && /iPhone|iPad/i.test(navigator.userAgent)) $('btnInstall').classList.remove('hide');
}
</script>
